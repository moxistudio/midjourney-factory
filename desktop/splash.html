<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Midjourney Factory</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.18), transparent 35%),
          radial-gradient(circle at 80% 30%, rgba(125, 211, 252, 0.14), transparent 35%),
          linear-gradient(135deg, #0f0f23 0%, #1a1a3e 60%, #232347 100%);
        color: #fafafa;
        font-family: "SF Pro Display", "Segoe UI", sans-serif;
      }

      .shell {
        width: min(560px, calc(100vw - 48px));
        padding: 32px 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(20, 20, 44, 0.55);
        backdrop-filter: blur(20px);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 12px;
        color: #a1a1aa;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: 42px;
        line-height: 1.05;
      }

      p {
        margin: 0;
        font-size: 14px;
        color: #d4d4d8;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(135deg, #f59e0b, #fb923c);
        box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.12);
        animation: pulse 1.2s ease-in-out infinite alternate;
      }

      .mono {
        font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        color: #c4b5fd;
      }

      @keyframes pulse {
        from { transform: scale(0.9); opacity: 0.75; }
        to { transform: scale(1.08); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="eyebrow">Desktop Runtime</div>
      <h1>Midjourney Factory</h1>
      <p>Starting Commander, Curator, and local runtime services inside the desktop shell.</p>
      <div class="row">
        <div class="dot"></div>
        <div class="mono">Waiting for local app services...</div>
      </div>
    </div>
  </body>
  </html>
